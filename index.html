<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContribLens — Open-Source Contribution Intelligence</title>
    <meta name="description" content="AI-powered open-source contribution intelligence platform that analyzes GitHub repositories to uncover project health, maintenance risks, matched issues, and step-by-step contribution plans." />
    <meta property="og:title" content="ContribLens — Open-Source Contribution Intelligence" />
    <meta property="og:description" content="AI-powered open-source contribution intelligence platform that analyzes GitHub repositories to uncover project health, maintenance risks, matched issues, and step-by-step contribution plans." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8FAF9] text-[#111827] antialiased selection:bg-[#15803D]/20 selection:text-[#0B0F0D]">
    <div id="root"></div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var code = params.get('code');
          if (code && window.opener) {
            document.body.innerHTML =
              '<div style="padding:24px;font-family:sans-serif;color:#111827;">Completing GitHub authentication...</div>';
            fetch('/api/auth/github/exchange', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ code: code }),
              credentials: 'include'
            })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data && data.sessionId && window.opener) {
                  window.opener.postMessage(
                    { type: 'OAUTH_AUTH_SUCCESS', sessionId: data.sessionId },
                    '*'
                  );
                  window.close();
                }
              })
              .catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
